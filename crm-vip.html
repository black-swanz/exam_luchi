<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экзамен для ВИП-оператора («Мой ВИП»)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --blue:#4a80c8; --blue-d:#3c6fb3; --link:#3d7fd9; --link-pale:#9cbbe6;
  --bar:#eef1f6; --card:#f4f5f7; --line:#dfe3e8; --line2:#e9ecef;
  --text:#212529; --muted:#8b929a; --muted2:#6c757d;
  --red:#dc3545; --red-t:#e04848; --green:#5aa864; --green-t:#3f9a4f;
  --yellow-bg:#fbe8b4; --peach-bg:#fbe9cf; --sel-bg:#dfe9fb; --sel-active:#3b82f6;
  --pt-blue:#3e78c9; --shadow:0 4px 18px rgba(20,30,50,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--text);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-width:1100px}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.muted{color:var(--muted)} .red{color:var(--red-t)} .green{color:var(--green-t)} .b{font-weight:600}
.hidden{display:none!important}
/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:56px;background:var(--bar);display:flex;align-items:center;gap:16px;padding:0 24px 0 16px;border-bottom:1px solid #e3e7ee}
.burger{width:62px;height:32px;border:0;border-radius:4px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.burger:hover{background:var(--blue-d)}
.topbar h1{font-size:16px;font-weight:600;margin:0;flex:1}
.tb-old{display:flex;align-items:center;gap:12px;font-size:15px}
.tb-link{color:var(--link);display:flex;align-items:center;gap:8px;font-size:16px;background:none;border:0;padding:4px}
.tb-ico{background:none;border:0;padding:4px;display:flex;color:#9aa1a9}
.tb-user{display:flex;align-items:center;gap:10px;font-size:16px;position:relative}
.avatar{width:32px;height:32px;border-radius:50%;background:#c9ced6;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.avatar-wrap{position:relative}
.st-dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bar);background:#e0524b}
.st-dot.on{background:#4caf50}.st-dot.pause{background:#f2c037}
.tb-play{display:flex;gap:6px;align-items:center}
.tb-play button{background:none;border:0;padding:2px;display:flex}
.tb-exit{background:none;border:0;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text)}
/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.0);z-index:80}
.drawer{position:fixed;top:0;left:0;bottom:0;width:340px;background:#fff;z-index:81;box-shadow:4px 0 24px rgba(0,0,0,.15);padding:16px 18px;overflow:auto;transform:translateX(-105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-head b{font-size:20px}
.drawer-head button{background:none;border:0;font-size:24px;line-height:1;color:#555}
.drawer a{display:block;background:var(--bar);color:var(--text);border-radius:4px;padding:10px 14px;margin-bottom:8px;font-size:16px;text-decoration:none}
.drawer a.active{background:var(--blue);color:#fff}
.drawer a:hover{filter:brightness(.97)}
/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start}
#view{flex:1;min-width:0;padding:24px 32px 120px}
#view.narrow{padding-left:10%;padding-right:10%}
.chat{width:clamp(320px,26vw,420px);flex:0 0 auto;position:sticky;top:56px;height:calc(100vh - 56px);border-left:1px solid var(--line);background:#f3f5f8;display:flex;flex-direction:column}
.c2d{position:fixed;right:28px;bottom:28px;z-index:60;background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:18px;box-shadow:var(--shadow)}
hr.sep{border:0;border-top:1px solid var(--line);margin:28px 0}
h2.sec{font-size:30px;font-weight:500;margin:0 0 22px}
h3.sec{font-size:26px;font-weight:500;margin:0 0 18px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 18px;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap}
.btn:hover{background:#f6f8fa}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.out-blue{border-color:var(--blue);color:var(--blue);background:#fff}
.btn.out-red{border-color:var(--red);color:var(--red);background:#fff;font-weight:500}
.btn.red{background:#d9534f;border-color:#d9534f;color:#fff}
.btn.grey{background:var(--bar);border-color:var(--bar)}
.btn.ghost-red{border:0;background:none;color:var(--red-t);font-weight:600}
.btn.out-green{color:var(--green-t);font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.btn.disabled-soft{background:#f1f3f5;border-color:#f1f3f5;color:#9aa1a9}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* ---------- forms ---------- */
.f-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
.f-grid>*{min-width:0}
.f{margin-bottom:22px;position:relative}
.f>label,.lbl{display:block;font-size:16px;margin-bottom:8px}
.req::after{content:"*";color:var(--red)}
.inp{width:100%;height:46px;border:1px solid var(--line);border-radius:4px;padding:0 14px;background:#fff;outline:none}
.inp:focus{border-color:#86b0ea;box-shadow:0 0 0 3px rgba(74,128,200,.15)}
textarea.inp{height:auto;min-height:110px;padding:10px 14px;resize:vertical}
.inp.err,.sel.err .sel-box,.dt.err .sel-box{border-color:var(--red)!important}
.err-msg{color:var(--red);font-size:14px;margin-top:6px}
.f>label.chk,.chk{display:inline-flex;margin:0;align-items:center;gap:10px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--blue)}
.tgl{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.tgl i{width:46px;height:26px;border-radius:13px;background:#dfe3e8;position:relative;flex:0 0 46px;transition:.15s}
.tgl i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.tgl.on i{background:var(--blue)} .tgl.on i::after{left:23px}
.copy{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--link);cursor:pointer}
/* custom select */
.sel{position:relative}
.sel-box{display:flex;align-items:center;min-height:46px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:text;padding:4px 0 4px 14px}
.sel.open .sel-box{border-color:#86b0ea;box-shadow:0 0 0 3px rgba(74,128,200,.15)}
.sel.dis .sel-box{background:#eef0f3;cursor:default}
.sel-val{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sel-val input{border:0;outline:none;flex:1;min-width:60px;height:34px;background:transparent;padding:0}
.sel-val .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph{color:#9aa1a9}
.sel-x{border:0;background:none;color:#9aa1a9;font-size:20px;padding:0 10px;line-height:1}
.sel-arr{border-left:1px solid var(--line);padding:0 14px;display:flex;align-items:center;height:28px;color:#333}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eceef1;border-radius:3px;padding:3px 8px;font-size:16px}
.chip b{font-weight:400;cursor:pointer;color:#555}
.sel-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);max-height:330px;overflow:auto;z-index:40;padding:4px 0}
.sel-list .opt{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.sel-list .opt:hover,.sel-list .opt.hl{background:var(--sel-bg)}
.sel-list .opt.cur{background:var(--sel-active);color:#fff}
.sel-list .opt .sub{display:block;font-size:14px;color:var(--muted2);margin-top:2px}
.sel-list .empty{padding:12px 16px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:8px;background:#777}
.dot.grey{background:#7a7a7a}.dot.green{background:#3fae5a}.dot.yellow{background:#f0d000}.dot.orange{background:#f0902d}.dot.red{background:#e63a3a}.dot.purple{background:#9b59d0}.dot.maroon{background:#5a1010}.dot.none{background:transparent}
/* date picker */
.dt .sel-box{cursor:pointer;gap:10px}
.cal{position:absolute;z-index:45;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:flex;top:calc(100% + 6px);left:0}
.cal.up{top:auto;bottom:calc(100% + 6px)}
.cal-m{padding:10px 12px;width:330px}
.cal-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.cal-h button{border:0;background:none;font-size:22px;color:#999;padding:0 8px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.cal-g .wd{font-size:14px;color:#555;padding:4px 0 10px}
.cal-g .d{padding:8px 0;border-radius:4px;cursor:pointer;font-size:15px}
.cal-g .d:hover{background:var(--sel-bg)}
.cal-g .d.oth{color:#bbb}.cal-g .d.past{color:#c3c3c3}
.cal-g .d.today{background:#e8eefb}
.cal-g .d.cur{background:var(--blue);color:#fff}
.cal-t{border-left:1px solid var(--line);width:110px;display:flex;flex-direction:column}
.cal-t b{text-align:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cal-t div{overflow:auto;max-height:300px}
.cal-t span{display:block;text-align:center;padding:6px 0;cursor:pointer;font-size:15px}
.cal-t span:hover{background:var(--sel-bg)} .cal-t span.past{color:#c3c3c3} .cal-t span.cur{background:var(--blue);color:#fff}
/* banners */
.ban{border-radius:2px;padding:14px 20px;margin:12px 0;display:flex;gap:12px;align-items:flex-start;font-size:17px}
.ban.y{background:var(--yellow-bg)} .ban.p{background:var(--peach-bg)}
.ban.center{justify-content:center}
.ban svg{flex:0 0 auto;margin-top:2px}
.ban-done{background:#fcefc4;border-radius:4px;padding:12px 18px;display:flex;align-items:center;gap:12px;margin:14px 0}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:left;font-weight:700;color:#444;padding:14px 12px;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.t td{padding:14px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#fafbfc}
table.t .sm{color:var(--muted);display:block}
table.plain th{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:16px}
.ext{display:inline-flex;margin-left:4px;vertical-align:-2px}
.pg{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:18px;color:#444}
.pg button{border:0;background:none;color:#aaa;font-size:18px}
.badge{display:inline-block;background:#6c757d;color:#fff;font-size:13px;font-weight:700;padding:1px 6px;border-radius:3px}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:#e45656;color:#fff;font-size:13px;font-weight:700;margin-right:8px}
.cnt.blue{background:#4a80c8}
/* list page */
.lp-head{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.lp-head .found{font-weight:600;margin-left:20px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 24px;margin-bottom:28px}
.tabs-out{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.tabs-out button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:4px;padding:8px 18px;font-size:16px}
.tabs-out button.on{background:var(--blue);color:#fff}
/* ticket */
.meta{display:flex;gap:40px;flex-wrap:wrap;margin:20px 0}
.meta div span{display:block;color:var(--muted);font-size:15px}
.ccard{background:var(--card);border-radius:8px;padding:28px 34px}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start}
.pt-name{display:inline-block;background:var(--pt-blue);color:#111;font-size:30px;font-weight:500;padding:0 6px;line-height:1.3}
.pt-name.blue{background:#3e78c9}.pt-name.green{background:#7bd389}.pt-name.yellow{background:#ffe066}.pt-name.red{background:#ff6b6b}.pt-name.none{background:none}
.pt-name span{color:#2c4f84}
.cc-links{display:flex;align-items:center;gap:0;font-size:16px}
.cc-links a{padding:0 18px;border-right:1px solid #cfd5dc}
.cc-links a.pale{color:var(--link-pale)}
.cc-links a:last-of-type{border-right:0}
.cc-links button{border:0;background:none;padding:0 0 0 18px;display:flex}
.kv{display:grid;grid-template-columns:2fr 3fr;gap:12px 10px;font-size:17px}
.kv .k{color:var(--muted)}
.cc-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:18px}
.kata{color:var(--link);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:17px}
.prog-ico{display:flex;gap:14px;align-items:center}
.prog-ico span{display:flex;color:#bfc5cc}.prog-ico span.on{color:#222}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:13px;padding:4px 8px;border-radius:3px;white-space:nowrap;z-index:5}
.actions-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.actions-row h2{margin:0}
.itabs{display:flex;justify-content:space-between;border-bottom:2px solid var(--line2);margin-top:10px}
.itabs button{flex:1;border:0;background:none;padding:14px 10px;font-size:17px;color:#333;border-bottom:3px solid transparent;margin-bottom:-2px}
.itabs button.on{border-bottom-color:var(--blue);color:var(--blue)}
.empty-note{text-align:center;color:var(--muted);padding:22px 0;font-size:16px}
.summary{display:flex;gap:34px;flex-wrap:wrap;margin-bottom:28px}
.summary div span{display:block;color:var(--muted);margin-bottom:10px}
/* map */
.clinic-pick{display:flex;border:1px solid var(--line);height:900px;position:relative}
.cp-left{width:40%;min-width:330px;max-width:546px;flex:0 0 auto;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.cp-filters{flex:1;overflow:auto;padding:22px 22px 0}
.cp-toggles{border-top:1px solid var(--line);padding:16px 22px;display:flex;flex-direction:column;gap:14px;background:#fff}
.map{position:relative;flex:1;min-width:0;width:100%;overflow:hidden;background:#f2efe6;cursor:grab;user-select:none;touch-action:none}
.map.drag{cursor:grabbing}
.map svg.base{position:absolute;left:0;top:0;transform-origin:0 0}
.map .pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;pointer-events:auto;transform:translate(-12px,-34px);display:flex;align-items:flex-start;gap:4px;cursor:pointer;white-space:nowrap}
.pin svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pin .pl{background:rgba(255,255,255,.92);padding:2px 6px;font-size:15px;margin-top:6px;border-radius:2px;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.pin.cluster{transform:translate(-20px,-20px)}
.pin.cluster b{width:40px;height:40px;border-radius:50%;background:#3d7fd9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 0 6px rgba(61,127,217,.25)}
.map-search{position:absolute;left:14px;top:12px;display:flex;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.map-search input{width:350px;height:38px;border:0;padding:0 14px;outline:none;font-size:15px}
.map-search button{border:0;background:#ffdb4d;padding:0 18px;font-size:15px;font-weight:600}
.map-zoom{position:absolute;left:14px;top:150px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:0}
.map-zoom button{width:38px;height:38px;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:24px;line-height:1;border-radius:3px}
.map-zoom .rail{width:4px;height:200px;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.2);margin:6px 0;position:relative}
.map-zoom .rail i{position:absolute;left:-12px;width:28px;height:12px;background:#fff;border:1px solid #ccc;border-radius:2px}
.map-copy{position:absolute;right:10px;bottom:6px;font-size:12px;color:#444;z-index:3;background:rgba(255,255,255,.7);padding:1px 6px}
.cl-pop{position:absolute;left:18%;right:24px;top:56px;max-height:calc(100% - 80px);overflow:auto;background:#fff;box-shadow:var(--shadow);z-index:6;padding:20px 22px 18px;font-size:16px}
.cl-pop h4{margin:0 0 18px;font-size:24px;font-weight:500;display:flex;align-items:center;gap:10px}
.cl-pop .x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:30px;color:#999;line-height:1}
.pop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,auto));gap:6px 30px;justify-content:start}
.pop-grid span{color:var(--muted)}
.hours b{font-weight:700}
.clinic-side{background:var(--card);padding:30px 44px;border-radius:4px}
.clinic-side h4{font-size:26px;font-weight:500;margin:0;display:flex;align-items:center;gap:10px}
/* editor */
.ed{border:1px solid var(--line);border-radius:4px;background:#fff}
.ed-tb{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid #ddd;margin:0 14px 0 14px}
.ed-tb .grp{display:flex;border:1px solid #aaa;border-radius:2px}
.ed-tb button{width:40px;height:38px;border:0;background:#fff;border-right:1px solid #aaa;display:flex;align-items:center;justify-content:center;font-weight:700}
.ed-tb .grp button:last-child{border-right:0}
.ed-body{min-height:260px;padding:14px;font-family:"Times New Roman",Times,serif;font-size:19px;outline:none;white-space:pre-wrap}
.hint{color:var(--muted);font-size:15px;margin-top:8px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(25,30,40,.45);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;overflow:auto}
.modal{background:#fff;border-radius:6px;width:720px;max-width:92vw;padding:26px 30px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin-bottom:60px}
.modal h3{margin:0 0 22px;font-size:24px;font-weight:600;display:flex;justify-content:space-between}
.modal h3 button{border:0;background:none;font-size:26px;color:#888;line-height:1}
.modal .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:10px}
.modal.wide{width:980px}
/* toasts */
#toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#5aa864;color:#fff;border-radius:4px;padding:14px 50px 14px 20px;font-size:18px;font-weight:600;display:flex;gap:14px;align-items:center;position:relative;box-shadow:var(--shadow);min-width:400px}
.toast.info{background:#4a80c8}.toast.warn{background:#e0a030}.toast.err{background:#d9534f}
.toast small{display:block;font-weight:400;font-size:15px}
.toast button{position:absolute;right:12px;top:8px;border:0;background:none;color:#fff;font-size:22px}
/* chat */
.ch-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.ch-head .nm{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.ch-head .ic{color:#4a80c8;display:flex}
.ch-head .close{border:1px solid #333;background:#fff;border-radius:3px;width:28px;height:28px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.ch-body{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 12px;border-radius:4px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg time{display:block;text-align:right;font-size:11px;color:#9aa1a9;font-style:italic;margin-top:6px}
.msg.cl{background:#fff;align-self:flex-start}
.msg.op{background:#dfe8f2;align-self:flex-end;margin-right:44px;position:relative}

/* ============================================================
   Схематичная карта: очерченные районы с подписями, зум, перетаскивание, поиск
   ============================================================ */
const MAP_W = 2000, MAP_H = 1500;
const MAPS = {}; const MAPCB = {};
const SUBURBS = ['Химки','Долгопрудный','Мытищи','Королёв','Балашиха','Реутов','Люберцы','Котельники','Видное','Коммунарка','Одинцово','Красногорск'];
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function clipHalf(poly, px, py, qx, qy) { // оставляем часть, ближе к p, чем к q
  const mx = (px + qx) / 2, my = (py + qy) / 2, nx = qx - px, ny = qy - py;
  const side = (x, y) => (x - mx) * nx + (y - my) * ny; const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], sa = side(a[0], a[1]), sb = side(b[0], b[1]);
    if (sa <= 0) out.push(a);
    if ((sa <= 0) !== (sb <= 0)) { const t = sa / (sa - sb); out.push([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]); }
  }
  return out;
}
let MAP_SVG = null;
function mapBaseSVG() {
  if (MAP_SVG) return MAP_SVG;
  const pad = 400; const box = [[-pad, -pad], [MAP_W + pad, -pad], [MAP_W + pad, MAP_H + pad], [-pad, MAP_H + pad]];
  let cells = '', labels = '';
  DISTRICTS.forEach((d, i) => {
    let poly = box;
    DISTRICTS.forEach((e, j) => { if (i !== j) poly = clipHalf(poly, d[1], d[2], e[1], e[2]); });
    const sub = SUBURBS.includes(d[0]);
    cells += `<path d="M${poly.map(p => p[0].toFixed(0) + ' ' + p[1].toFixed(0)).join('L')}Z" fill="${sub ? '#eeece6' : '#fbfaf7'}" stroke="#cfcac0" stroke-width="2"/>`;
    labels += `<text x="${d[1]}" y="${d[2]}" font-size="${sub ? 19 : 16}" fill="${sub ? '#8d877b' : '#a39d91'}" text-anchor="middle" letter-spacing="2" font-weight="${sub ? 600 : 500}" style="text-transform:uppercase">${d[0].toUpperCase()}</text>`;
  });
  // контур «Москва» (условный)
  const ring = `<ellipse cx="1000" cy="800" rx="720" ry="640" fill="none" stroke="#c9b99a" stroke-width="3" stroke-dasharray="14 10"/>`;
  MAP_SVG = `<svg class="base" width="${MAP_W}" height="${MAP_H}" viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible"><rect x="-3000" y="-3000" width="8000" height="8000" fill="#e9e6df"/>${cells}${ring}${labels}<text x="1000" y="805" font-size="34" fill="#6f6a60" text-anchor="middle" font-weight="700" letter-spacing="6" opacity=".35">МОСКВА</text></svg>`;
  return MAP_SVG;
}
function distXY(name, key) {
  const d = DISTRICTS.find(x => x[0] === name); if (!d) return null;
  let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) % 9973;
  const r = seeded(h + 7); return [d[1] + (r() - .5) * 110, d[2] + 18 + (r() - .2) * 60];
}
CLINICS.forEach(c => { const p = c.dist ? distXY(c.dist, c.id) : null; if (p) { c.x = p[0]; c.y = p[1]; } else { c.x = null; c.y = null; } });

/* pins: [{id,x,y,label,color}] */
function mapHTML(id, pins, opt = {}) {
  MAPS[id] = MAPS[id] || { k: opt.k || 0.62, tx: opt.tx != null ? opt.tx : -260, ty: opt.ty != null ? opt.ty : -150, pins: [] };
  MAPS[id].pins = pins.filter(p => p.x != null); if (opt.focus) MAPS[id].focus = opt.focus;
  return `<div class="map" id="${id}" style="${opt.h ? 'height:' + opt.h + 'px;flex:none' : ''}">${mapBaseSVG()}<div class="pins"></div>
  ${opt.noSearch ? '' : `<div class="map-search"><input placeholder="Адрес или объект" data-map-q="${id}"><button data-act="mapFind" data-map="${id}">Найти</button></div>`}
  <div class="map-zoom" style="${opt.noSearch ? 'top:14px' : ''}"><button data-act="mapZoom" data-map="${id}" data-z="1">+</button><button data-act="mapZoom" data-map="${id}" data-z="-1">−</button></div>
  <div class="map-copy">Схема «Лучи»</div></div>`;
}
function mapApply(id) {
  const m = MAPS[id], el = document.getElementById(id); if (!el) return;
  el.querySelector('svg.base').style.transform = `translate(${m.tx}px,${m.ty}px) scale(${m.k})`;
  const box = el.querySelector('.pins'); const W = el.clientWidth, H = el.clientHeight;
  let pins = m.pins; const out = [];
  if (pins.length > 12 && m.k < 0.8) {
    const cell = 110 / m.k; const g = {};
    pins.forEach(p => { const key = Math.floor(p.x / cell) + ':' + Math.floor(p.y / cell); (g[key] = g[key] || []).push(p); });
    Object.values(g).forEach(arr => { if (arr.length === 1) out.push(arr[0]); else out.push({ cluster: arr.length, x: arr.reduce((s, p) => s + p.x, 0) / arr.length, y: arr.reduce((s, p) => s + p.y, 0) / arr.length }); });
  } else out.push(...pins);
  box.innerHTML = out.map(p => {
    const sx = p.x * m.k + m.tx, sy = p.y * m.k + m.ty; if (sx < -300 || sy < -60 || sx > W + 40 || sy > H + 60) return '';
    if (p.cluster) return `<div class="pin cluster" style="left:${sx}px;top:${sy}px" data-act="mapCluster" data-map="${id}"><b>${p.cluster}</b></div>`;
    return `<div class="pin ${p.color === 'red' ? 'red' : ''}" style="left:${sx}px;top:${sy}px" data-act="mapPin" data-map="${id}" data-pin="${p.id}"><i></i>${p.label ? `<span class="pl">${esc(p.label)}</span>` : ''}</div>`;
  }).join('');
}
function mapZoomAt(id, f, px, py) { const m = MAPS[id]; const nk = Math.min(4, Math.max(0.25, m.k * f)); const r = nk / m.k; m.tx = px - (px - m.tx) * r; m.ty = py - (py - m.ty) * r; m.k = nk; mapApply(id); }
function mapCenter(id, x, y, k) { const m = MAPS[id], el = document.getElementById(id); if (!el) return; if (k) m.k = k; m.tx = el.clientWidth / 2 - x * m.k; m.ty = el.clientHeight / 2 - y * m.k; mapApply(id); }
function initMaps() {
  $$('.map').forEach(el => {
    const id = el.id; if (el._init) return; el._init = true;
    const m = MAPS[id]; if (m.focus) { mapCenter(id, m.focus.x, m.focus.y, m.focus.k); m.focus = null; } else mapApply(id);
    el.addEventListener('wheel', e => { e.preventDefault(); const r = el.getBoundingClientRect(); mapZoomAt(id, e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    let drag = null;
    el.addEventListener('pointerdown', e => { if (e.target.closest('.pin,.map-search,.map-zoom,.cl-pop')) return; drag = { x: e.clientX, y: e.clientY, tx: m.tx, ty: m.ty, moved: false }; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => { if (!drag) return; m.tx = drag.tx + e.clientX - drag.x; m.ty = drag.ty + e.clientY - drag.y; drag.moved = true; mapApply(id); });
    const up = () => { if (drag && drag.moved) log('map', { action: 'pan' }); drag = null; el.classList.remove('drag'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('dblclick', e => { if (e.target.closest('.pin,.map-search,.map-zoom,.cl-pop')) return; const r = el.getBoundingClientRect(); mapZoomAt(id, 1.6, e.clientX - r.left, e.clientY - r.top); });
  });
}
ACT.mapZoom = a => { const id = a.dataset.map, el = document.getElementById(id); mapZoomAt(id, +a.dataset.z > 0 ? 1.4 : 1 / 1.4, el.clientWidth / 2, el.clientHeight / 2); log('map', { action: 'zoom', dir: a.dataset.z }); };
ACT.mapCluster = a => { mapZoomAt(a.dataset.map, 2, parseFloat(a.style.left), parseFloat(a.style.top)); };

document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.mapQ) { e.preventDefault(); ACT.mapFind({ dataset: { map: e.target.dataset.mapQ } }); } });
ACT.mapFind = a => {
  const id = a.dataset.map; const q = ($(`[data-map-q="${id}"]`).value || '').toLowerCase().trim().replace(/^(м\.?|метро)\s*/, ''); log('map', { action: 'search', q });
  if (!q) return;
  // сначала точное совпадение района («сокол» → Сокол, не Сокольники), потом самый короткий район, начинающийся с запроса
  const exact = DISTRICTS.find(x => x[0].toLowerCase() === q);
  const pref = DISTRICTS.filter(x => q.length >= 3 && x[0].toLowerCase().startsWith(q)).sort((a, b) => a[0].length - b[0].length)[0];

function fakeRows(n, seed, fn) { const r = seeded(seed); return Array.from({ length: n }, (_, i) => fn(i, r)); }
const pick = (arr, r) => arr[Math.floor(r() * arr.length)];
const cName = id => { const c = CLINICS.find(x => x.id === id); return c ? c.name : (id || '-'); };
const dtCell = s => s && s.includes(' ') ? `${s.split(' ')[0]}<span class="sm">${s.split(' ')[1]}</span>` : (s || '-');
function chatTime(s) { const m = String(s || '').match(/(\d\d)\.(\d\d)\.(\d{4}) (\d\d:\d\d)/); if (!m) return s || ''; return `${+m[1]} ${['янв.','февр.','мар.','апр.','мая','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'][+m[2] - 1]} ${m[4]}`; }


/* ---- совместимость с платформой экзамена (exam-platform): единая лента S.chat для пульта коуча ---- */
var PATIENT = { name: SCENARIO_TICKETS.length ? SC_META.title + ' · ' + SCENARIO_TICKETS.length + ' обращ.' : SC_META.title };
function mirror(from, text, t) {
  S.chat = S.chat || [];
  const p = pat(t.pid); const tag = `[Кейс ${t.case || '—'} · №${t.id} · ${shortName(p.name)}] `;
  S.chat.push({ from, text: tag + text, time: fmtT(nowD()) });
}

/* ---------------- падение тикетов после «Старт» ---------------- */
let AC = null;
function beep() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1320, 0.16]].forEach(([f, t0]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination); const t = AC.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.start(t); o.stop(t + 0.4); });
  } catch (e) {}
}
function deliver(t) {
  const now = fmtDT(nowD()); t.arrived = true; t.created = t.presetCreated || now; t.creator = 'system';
  const chat = S.pt[t.pid].chat;
  if (t.msg) { chat.push({ from: 'system', text: 'Обращение начато ' + chatTime(now), d: now }); chat.push({ from: 'client', text: t.msg, d: now }); t.preview = t.msg; t.unread = 1; }
  else { const last = [...chat].reverse().find(m => m.from === 'client'); t.preview = last ? last.text : ''; t.unread = 0; }
  t.changes.push({ date: now, who: 'system', what: 'Обращение создано, назначено на ' + OPERATOR });
  mirror('system', 'Новое обращение «' + TICKET_TYPES[t.type] + '». ' + (t.msg ? 'Клиент: «' + t.msg + '»' : 'Последнее сообщение в чате: «' + t.preview + '»') + ' — чтобы ответить от этого клиента, начните сообщение с #' + t.case, t);
  log('ticket_arrive', { ticket: t.id, case: t.case, ticketType: TICKET_TYPES[t.type], patient: t.pid });
}
function tick(force) {
  if (!S.startAt) return;
  const el = (Date.now() - S.startAt) / 1000; const due = S.order.map(id => S.tickets[id]).filter(t => t && !t.arrived && (force || t.drop <= el));
  if (!due.length || S.opStatus !== 'on') return;
  due.forEach(deliver); save(); beep();
  toast(due.length > 1 ? `Новые обращения: ${due.length}` : 'Новое обращение', due.map(t => '№' + t.id).join(', '), 'info');
  if (['appeals', 'appeal'].includes(route().name)) render();
  if (typeof coachRefresh === 'function') coachRefresh();
}
setInterval(() => tick(false), 1000);

const fileCard = f => { const o = typeof f === 'string' ? { name: f } : f; return `<div class="fcard" data-act="fileStub"><span class="fpdf">PDF</span><div class="fmeta"><b>${esc(o.name)}</b><small>PDF${o.size ? ' - ' + esc(o.size) : ''}</small></div></div>`; };

}

function renderChat(t) {
  const c = $('#chat'); const p = pat(t.pid); const msgs = S.pt[t.pid].chat;
  c.innerHTML = `<div class="ch-head"><span class="avatar" style="width:28px;height:28px">${I.user}</span><span class="nm">${esc(p.name)}</span><span class="ic tip" data-tip="Теги">${I.bubble}</span><button class="close" data-act="chatClose" title="Закрыть">×</button></div>

  const b = $('#chbody'); b.scrollTop = b.scrollHeight;

ACT.chatSend = () => {
  const t = curTicket(); const ti = $('#chin'); const text = (ti.value || '').trim(); if (!text || !t) return;
  S.pt[t.pid].chat.push({ from: 'operator', text, d: fmtDT(nowD()) }); mirror('operator', text, t); S.ui['draft_' + t.pid] = '';
  Object.values(S.tickets).forEach(x => { if (x.pid === t.pid) x.unread = 0; });

};

  openModal(`<h3>Шаблоны ответов <button data-act="modalClose">×</button></h3>${tpls.map(x => `<div style="padding:10px 0;border-bottom:1px solid #eee;cursor:pointer" data-act="tplPick" data-t="${esc(x)}">${esc(x)}</div>`).join('')}`);
};

ACT.chatAttach = () => {
  const files = S.downloads || [];
  openModal(`<h3>Прикрепить файл <button data-act="modalClose">×</button></h3>${files.length ? `<div class="muted" style="margin-bottom:10px">Загрузки</div>${files.map(f => `<div class="dl-row" data-act="attachPick" data-f="${esc(f)}">📄 ${esc(f)}</div>`).join('')}` : '<div class="empty-note">В «Загрузках» нет файлов</div>'}`);

function clientSay(text, ticketId) {
  text = String(text || '').trim(); if (!text) return;
  const all = S.order.map(id => S.tickets[id]).filter(t => t && t.arrived && !t.past);
  // адресация из пульта коуча: «#3 текст» — кейс 3, «№9160163 текст» — номер обращения
  const mm = text.match(/^\s*(#|№)\s*(\d+)[\s:.,-]*/);
  if (mm && !ticketId) { const n = +mm[2]; const hit = mm[1] === '#' ? all.find(x => x.case === n) : all.find(x => x.id === n); if (hit) { ticketId = hit.id; text = text.slice(mm[0].length).trim() || text; } }
  let t = ticketId ? S.tickets[+ticketId] : (all.find(x => x.waiting) || (curTicket() && curTicket().arrived && !curTicket().past ? curTicket() : all[all.length - 1]));
  if (!t) { toast('Нет обращений в работе', '', 'warn'); return; }
  const now = fmtDT(nowD()); S.pt[t.pid].chat.push({ from: 'client', text, d: now }); mirror('client', text, t);
  let back = false;
  Object.values(S.tickets).filter(x => x.pid === t.pid && x.arrived && !x.past).forEach(x => { if (x.waiting) { x.waiting = false; x.hidden = false; x.status = 'В работе'; x.changes.push({ date: now, who: 'system', what: 'Пациент ответил — обращение вернулось в работу' }); back = true; } x.unread = (x.unread || 0) + 1; x.preview = text; });
  log('chat_client', { ticket: t.id, patient: t.pid, text, returned: back }); save(); beep();
  toast('Новое сообщение от пациента', back ? 'Обращение №' + t.id + ' вернулось в работу' : pat(t.pid).name, 'info');
  render();
}

/* ============================================================

const apNum = id => String(id).replace(/^A/, '');
function apLabel(a) { const sv = a.services.map(s => s.name).join(', '); return `${a.created}: ${sv || '(-)'}${a.clinic && sv ? ` (${cName(a.clinic)})` : ''}`; }
const stIcon = st => st === 'ok' ? I.check() : st === 'no' ? I.minusC : I.qC;
function apServ(services) {
  if (!services || !services.length) return '-';
  return services.map(s => `<div class="ap-s">${stIcon(s.st)} ${esc(s.name)} (${s.qty || 1} шт.)<div class="ap-tip"><div>${stIcon(s.st)} ${esc(s.name)} (${s.qty || 1} шт.)</div><div class="ap-st">${esc(s.status || 'Согласовано')}</div><div><b>Комментарий:</b> ${esc(s.comment || '-')}</div></div></div>`).join('');
}

function apCell(a) {
  if (!a.services || !a.services.length) return '-';
  const lines = a.services.map(s => `<div class="ap-line">${stIcon(s.st)}<span>${esc(s.name)} (${s.qty || 1} шт.)</span></div>`).join('');
  const tip = `<div class="ap-tip2">${a.services.map(s => `<div class="t-s">${stIcon(s.st)}<div><b>${esc(s.name)} (${s.qty || 1} шт.)</b><small>${esc(s.status || 'Согласовано')}</small></div></div>`).join('')}
    <div class="t-f"><div><b>Диагноз:</b> ${esc(a.diagnosis && a.diagnosis !== '-' ? a.diagnosis : '-')}</div><div><b>Случай:</b> ${esc(a.caseType || '-')}</div><div><b>Комментарий:</b> ${esc(a.comment || (a.services[0] && a.services[0].comment) || '-')}</div></div></div>`;
  return `<div class="ap-cell">${lines}${tip}</div>`;
}
const gpServQ = s => s && s.length ? s.map(x => { const o = typeof x === 'string' ? { name: x, qty: 1 } : x; return `<div class="ap-line">${I.check()}<span>${esc(o.name)} (${o.qty || 1} шт.)</span></div>`; }).join('') : '-';
const sortIco = '<span class="sort-ico" title="Сортировка">—</span>';
function histDesc(x) {
  if (x.desc != null) return x.desc;
  if (x.type === 'konsult' && x.form && x.form.desc) return x.form.desc;
  if (x.past) return (x.comments[0] && x.comments[0].text) || '';
  return x.creator === OPERATOR ? (x.preview || '') : '';
}
ACT.histOpen = a => { const t = S.tickets[+a.dataset.id]; if (t && t.type === 'gp' && t.past && t.gps && t.gps[0] && findGp(t.gps[0])) { openTab('#/gp/' + encodeURIComponent(t.gps[0])); return; } openTab('#/appeal/' + a.dataset.id); };

function infoTable(k, t, pid) {
  const P = pat(pid); const empty = '<div class="empty-note">Нет данных</div>';
  const tbl = (head, rows) => rows.length ? `<table class="t plain info-t"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table><div class="pg"><span>Строк на странице:</span><span class="pg-sel">20 ${I.chevD}</span><span>« ‹ &nbsp; 1 / 1 &nbsp; › »</span></div>` : empty;
  if (k === 'hist') {
    const list = Object.values(S.tickets).filter(x => x.arrived && (x.pid === pid || +x.whom === pid)).sort((a, b) => dtKey(b.created) - dtKey(a.created) || b.id - a.id);
    return tbl(['Номер', 'Создано ' + sortIco, 'Тема', 'Статус', 'Описание', 'Владелец'], list.map(x => { const d = histDesc(x); const own = x.owner != null ? x.owner : login(x.resp === '-' ? '' : x.resp);
      return `<tr><td><a data-act="histOpen" data-id="${x.id}">${x.id}</a></td><td>${dtCell(x.created)}</td><td>${esc(x.topic || TICKET_TYPES[x.type])}</td><td>${esc(x.status === 'Закрыто' ? 'Завершено' : x.status)}</td><td class="ell" title="${esc(d)}">${esc(d)}</td><td>${esc(own)}</td></tr>`; }));
  }
  if (k === 'visits') return tbl(['Номер', 'Клиника', 'Услуга или продукт', 'Дата', 'Врач', 'Способ связи', 'Статус'], P.visits.slice().sort((a, b) => dtKey(b.agreed || b.created) - dtKey(a.agreed || a.created)).map(v => `<tr><td><a data-act="openVisit" data-id="${v.id}">${v.id}</a></td><td>${v.wishClinic != null && v.ticket ? `<div><b>Желаемая:</b> ${esc(v.wishClinic ? cName(v.wishClinic) : '-')}</div><div><b>Выбранная:</b> ${esc(cName(v.clinic))}</div>` : esc(cName(v.clinic))}</td><td>${esc(v.service)}${v.onlineSlot ? ' <span class="slot-badge">Записан в онлайн-слот</span>' : ''}</td><td>${v.ticket ? `<div><b>Желаемая:</b> ${esc(v.wish || '-')}</div><div><b>Согласованная:</b> ${esc(v.agreed || '-')}</div>` : dtCell(v.agreed || '-')}</td><td>${esc(v.doctor || '-')}</td><td>${esc(v.comm || '-')}</td><td>${esc(v.status)}</td></tr>`));

  <div class="f-grid">${fld('Анамнез заболевания', nl(m.anamnesis))}${fld('Анамнез жизни', nl(m.life))}${fld('Рекомендации', nl(m.recs))}${fld('Диагноз на подозрение', nl(m.susp))}${fld('Диагноз', nl(m.diag))}${fld('Результаты обследований', nl(m.results))}</div>
  ${fld('Дообследование за счет БД', nl(m.extraBD))}${fld('Дообследование за счет пациента', nl(m.extraPt))}
  <label class="chk" style="margin:10px 0 24px"><input type="checkbox" disabled><span>Отправить только рекомендации</span></label>
  <div class="f-grid">${fld('Вопрос-ответ', '-')}${fld('Больничный лист/справка', '-')}${fld('Родственник', '-')}${fld('Рецепт', '-')}${fld('Контроль куратора', '-')}${fld('Чекап', '-')}${fld('Наблюдение хронического заболевания', '-')}${fld('Дата повторной консультации', esc(m.repeat || '-'))}</div>
  <hr class="sep"><div class="actions-row"><h2 class="sec">Действия с<br>консультацией</h2><div class="btn-row"><button class="btn pale" disabled>Добавить в мед.карту</button><button class="btn pale" disabled>Отправить в чат</button></div></div><hr class="sep">`;
}
ACT.tmBack = () => go('#/telemed');

/* ============================================================
   ПАНЕЛЬ КОУЧА (Ctrl+Shift+K или ?coach=1) и API для LMS
   ============================================================ */
let coachOpen = /[?&]coach=1/.test(location.search) || /coach=1/.test(location.hash);
function coachToggle() { coachOpen = !coachOpen; coachRender(); }
function coachRender() {
  const el = $('#coach');
  if (!coachOpen) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const arrived = S.order.map(id => S.tickets[id]).filter(t => t && t.arrived && !t.past);
  const pending = S.order.map(id => S.tickets[id]).filter(t => t && !t.arrived);
  const el2 = S.startAt ? Math.floor((Date.now() - S.startAt) / 1000) : 0;
  const sel0 = S.ui.coachT || (arrived[0] && arrived[0].id) || '';
  el.innerHTML = `<h4>Панель коуча · пишет «клиент» <button data-act="coachClose">×</button></h4><div style="margin-bottom:6px;color:#9ca3af">${esc(SC_META.title)}</div>${SC_ERRORS.length ? `<div style="background:#7f1d1d;padding:6px;border-radius:4px;margin-bottom:6px;white-space:pre-wrap">Ошибки сценария:\n${esc(SC_ERRORS.join('\n'))}</div>` : ''}
  <div>${S.startAt ? `С начала смены: ${Math.floor(el2 / 60)} мин ${el2 % 60} с` : 'Смена не начата (оператор не нажал ▶)'} · ждут падения: ${pending.length ? pending.map(t => '№' + t.id + ' (' + Math.round(t.drop / 60) + ' мин)').join(', ') : '—'}</div>
  <select id="coachT">${arrived.map(t => `<option value="${t.id}" ${+sel0 === t.id ? 'selected' : ''}>№${t.id} · ${esc(shortName(pat(t.pid).name))} · ${TICKET_TYPES[t.type]}${t.waiting ? ' · ждёт ответа' : ''}</option>`).join('') || '<option value="">нет обращений</option>'}</select>
  <textarea id="coachTxt" placeholder="Сообщение от клиента выбранного обращения…"></textarea>
  <div class="row"><button class="c" data-act="coachSend">Отправить как клиент</button>${pending.length ? '<button class="c g" data-act="coachDrop">Выдать оставшиеся тикеты сейчас</button>' : ''}</div>
  <div class="row"><button class="c g" data-act="coachExport" data-f="json">Лог JSON</button><button class="c g" data-act="coachExport" data-f="csv">Лог CSV</button><button class="c g" data-act="coachReset">Сбросить сессию</button></div>
  <div class="log" id="coachLog">${S.log.slice(-40).reverse().map(e => `${(e.crmTime || '').split(' ')[1] || ''} ${e.type}${e.ticket ? ' #' + e.ticket : ''}${e.field ? ' ' + String(e.field).replace(/^tickets\.\d+\.form\./, '') + '=' + JSON.stringify(e.value).slice(0, 40) : ''}${e.text ? ' «' + String(e.text).slice(0, 50) + '»' : ''}${e.action ? ' ' + e.action : ''}`).map(esc).join('\n')}</div>`;
  $('#coachT').onchange = e => { S.ui.coachT = e.target.value; save(); };
}
function coachRefresh() { if (coachOpen) coachRender(); }
setInterval(() => { if (coachOpen && !document.activeElement.closest('#coach')) coachRender(); }, 5000);
ACT.coachClose = () => { coachOpen = false; coachRender(); };
ACT.coachSend = () => { const v = $('#coachTxt').value; const tid = $('#coachT').value; clientSay(v, tid || null); coachRender(); };
ACT.coachDrop = () => { if (!S.startAt) S.startAt = Date.now(); const was = S.opStatus; S.opStatus = 'on'; tick(true); S.opStatus = was === 'off' ? 'on' : was; save(); render(); coachRender(); };
ACT.coachReset = () => { if (!confirm('Сбросить всё состояние тренажёра и лог?')) return; S = freshState(); save(); location.hash = '#/appeals'; render(); coachRender(); };
ACT.coachExport = a => {
  const f = a.dataset.f; let data, type, name = `crm-log-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}`;
  if (f === 'json') { data = JSON.stringify({ startedAt: S.startedAt, examStart: S.startAt ? new Date(S.startAt).toISOString() : null, exportedAt: new Date().toISOString(), log: S.log, result: resultSummary() }, null, 2); type = 'application/json'; name += '.json'; }
  else { const keys = ['ts', 'crmTime', 'type', 'ticket', 'field', 'value', 'text', 'action', 'route']; data = '﻿' + keys.join(';') + '\n' + S.log.map(e => keys.map(k => `"${String(e[k] == null ? '' : typeof e[k] === 'object' ? JSON.stringify(e[k]) : e[k]).replace(/"/g, '""')}"`).join(';')).join('\n'); type = 'text/csv'; name += '.csv'; }
  const b = new Blob([data], { type }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
};
function resultSummary() {
  return {
    tickets: Object.values(S.tickets).filter(t => !t.past).map(t => ({ id: t.id, case: t.case || null, type: TICKET_TYPES[t.type], patient: t.pid, arrived: t.arrived, created: t.created, status: t.status, done: t.done, closeReason: t.closeReason || null, postpone: t.postpone || null, transfer: t.transfer || null, records: t.records, gps: t.gps, comments: t.comments, form: snap(t.form), chat: t.arrived ? S.pt[t.pid].chat : [] })),
    created: Object.values(S.tickets).filter(t => !t.past && !t.case).map(t => ({ id: t.id, type: TICKET_TYPES[t.type], patient: t.pid, resp: t.resp, group: t.group, comments: t.comments })),
    claims: S.claims, konsults: S.konsults, downloads: S.downloads
  };
}
window.CRM = {
  clientSay: (text, ticketId) => clientSay(text, ticketId),
  getLog: () => JSON.parse(JSON.stringify(S.log)),
  getResult: () => JSON.parse(JSON.stringify(resultSummary())),
  reset: () => { S = freshState(); save(); location.hash = '#/appeals'; render(); },
  onEvent: null
};
window.addEventListener('message', e => {
  const d = e.data; if (!d || d.source !== 'luchi-lms') return;
  if (d.type === 'client-message') clientSay(d.text, d.ticketId);
  if (d.type === 'reset') CRM.reset();
  if (d.type === 'get-result' && e.source) e.source.postMessage({ source: 'luchi-crm', type: 'result', result: resultSummary(), log: S.log }, '*');
});

render(); coachRender();
if (!S.log.length) log('session_start', { scenario: SCENARIO_TICKETS.map(t => t.id) });
tick(false);
</script>
</body>
</html>
